services:
  backend:
    build:
      context: ./backend
    env_file:
      - .env
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
        VITE_TOOLFORGE_API_KEY: ${VITE_TOOLFORGE_API_KEY:-}
    ports:
      - "5173:80"
    depends_on:
      - backend
